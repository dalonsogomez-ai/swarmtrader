[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swarmtrader"
version = "1.5.0"
description = "Enjambre de agentes para seleccion de acciones a 1 mes, con control de comparacion multiple"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.1", "scipy>=1.11", "joblib>=1.3",
                "tzdata>=2024.1; sys_platform == 'win32'"]

[project.optional-dependencies]
data = ["pyarrow>=14", "yfinance>=0.2"]
broker = ["alpaca-py>=0.21"]
ml = ["lightgbm>=4.1"]
deep = ["torch>=2.2"]
stats = ["arch>=7.0"]
store = ["duckdb>=1.0", "pyarrow>=14"]
ibkr = ["ib_async>=1.0"]
dev = ["pytest>=7.4"]
report = ["matplotlib>=3.8"]

[project.scripts]
swarmtrader = "swarmtrader.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
